<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tic-Tac-Toe — School Games Portal</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  .ttt-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; width: 100%; max-width: 360px; }
  .ttt-cell { aspect-ratio: 1; border-radius: 10px; background: var(--bg-elev-2); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center; overflow: hidden; line-height: 1;
    font-size: clamp(30px, 10vw, 44px); font-weight: 800; cursor: pointer; transition: background var(--dur-fast), transform var(--dur-fast);
    box-shadow: 0 1px 0 rgba(255,255,255,.06) inset, 0 3px 0 rgba(0,0,0,.35); }
  .ttt-cell:not(.x):not(.o):hover { transform: translateY(-2px); background: var(--bg-elev); }
  .ttt-cell.x { color: var(--accent); text-shadow: 0 0 16px rgba(91,140,255,.5); }
  .ttt-cell.o { color: var(--accent-2); text-shadow: 0 0 16px rgba(53,208,186,.5); }
  .ttt-cell.win { background: rgba(245,185,66,.2); border-color: var(--gold); }
  html.perf-low .ttt-cell:hover { transform: none; }
  html.perf-low .ttt-cell.x, html.perf-low .ttt-cell.o { text-shadow: none; }
  .ttt-cell.mark-new { animation: tttPop .2s ease; }
  @keyframes tttPop { from { transform: scale(.5); opacity: .3; } to { transform: scale(1); opacity: 1; } }
  html.perf-low .ttt-cell.mark-new { animation: none; }
  .stage-wrap.board-wrap { display: block; width: 100%; }
</style>
</head>
<body>
<div id="app-header"></div>
<main>
  <div class="container game-shell">
    <div id="gameTopbar"></div>
    <div class="game-stage">
      <div class="game-hud"><span>X wins: <b id="hudX">0</b></span><span>O wins: <b id="hudO">0</b></span><span>Draws: <b id="hudD">0</b></span></div>
      <div class="seg" id="modePick" style="width:240px"></div>
      <div class="seg" id="aiDiffPick" style="width:240px;display:none"></div>
      <div class="stage-wrap board-wrap">
        <div class="ttt-grid" id="grid"></div>
        <div class="overlay-msg" id="overlay" style="display:none">
          <h2 id="overText"></h2>
          <button class="btn primary" id="nextBtn">Next Round</button>
        </div>
      </div>
      <p class="game-controls-hint" id="turnHint">Two players, one device. X goes first.</p>
    </div>
  </div>
</main>
<div id="toast-root"></div>
<script src="../js/storage.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/achievements.js"></script>
<script src="../js/cosmetics.js"></script>
<script src="../js/games-data.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/game-api.js"></script>
<script>
SGPUI.renderHeader('');
SGPGame.renderTopbar({ id: 'tictactoe', title: 'Tic-Tac-Toe', icon: '❌' });

(() => {
  const gridEl = document.getElementById('grid'), overlay = document.getElementById('overlay'), overText = document.getElementById('overText'), hint = document.getElementById('turnHint');
  const hudX = document.getElementById('hudX'), hudO = document.getElementById('hudO'), hudD = document.getElementById('hudD');
  const aiDiffPick = document.getElementById('aiDiffPick');
  const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  let board, turn, wins = { X: 0, O: 0, D: 0 }, active;
  let mode = 'pvp', aiLevel = 'medium';

  mode = SGPGame.mountDifficultyPicker(document.getElementById('modePick'), 'tictactoe_mode',
    [{ value: 'pvp', label: '2 Players' }, { value: 'ai', label: 'vs Computer' }],
    'pvp', v => { mode = v; aiDiffPick.style.display = v === 'ai' ? 'flex' : 'none'; nextRound(); });
  aiDiffPick.style.display = mode === 'ai' ? 'flex' : 'none';
  aiLevel = SGPGame.mountDifficultyPicker(aiDiffPick, 'tictactoe_ai',
    [{ value: 'easy', label: 'Easy' }, { value: 'medium', label: 'Medium' }, { value: 'hard', label: 'Unbeatable' }],
    'medium', v => { aiLevel = v; nextRound(); });

  function render(winLine, newIndex) {
    gridEl.innerHTML = board.map((v, i) => `<div class="ttt-cell ${v ? v.toLowerCase() : ''} ${winLine && winLine.includes(i) ? 'win' : ''} ${i === newIndex ? 'mark-new' : ''}" data-i="${i}">${v || ''}</div>`).join('');
    gridEl.querySelectorAll('.ttt-cell').forEach(el => el.addEventListener('click', () => play(+el.dataset.i)));
    hint.textContent = !active ? '' : (mode === 'ai' && turn === 'O' ? "Computer's turn..." : `Player ${turn}'s turn`);
  }

  function checkWinner(b) {
    for (const line of LINES) {
      const [a, x, c] = line;
      if (b[a] && b[a] === b[x] && b[a] === b[c]) return { winner: b[a], line };
    }
    if (b.every(v => v)) return { winner: 'draw' };
    return null;
  }

  function emptyIndices(b) { return b.map((v, i) => v ? -1 : i).filter(i => i >= 0); }

  function minimax(b, player) {
    const result = checkWinner(b);
    if (result) {
      if (result.winner === 'O') return { score: 10 };
      if (result.winner === 'X') return { score: -10 };
      return { score: 0 };
    }
    const moves = emptyIndices(b).map(i => {
      const nb = b.slice(); nb[i] = player;
      return { index: i, score: minimax(nb, player === 'O' ? 'X' : 'O').score };
    });
    return player === 'O'
      ? moves.reduce((best, m) => m.score > best.score ? m : best)
      : moves.reduce((best, m) => m.score < best.score ? m : best);
  }

  function aiPickMove() {
    const options = emptyIndices(board);
    if (aiLevel === 'easy') return options[Math.floor(Math.random() * options.length)];
    if (aiLevel === 'medium' && Math.random() < 0.5) return options[Math.floor(Math.random() * options.length)];
    return minimax(board, 'O').index;
  }

  function play(i) {
    if (!active || board[i]) return;
    if (mode === 'ai' && turn === 'O') return; // ignore clicks during the computer's turn
    commitMove(i);
  }

  function commitMove(i) {
    board[i] = turn;
    SGPGame.beep(turn === 'X' ? 500 : 620, 0.05, 'square');
    const result = checkWinner(board);
    if (result) {
      active = false;
      if (result.winner === 'draw') { wins.D++; hudD.textContent = wins.D; overText.textContent = "It's a draw!"; }
      else {
        wins[result.winner]++;
        (result.winner === 'X' ? hudX : hudO).textContent = wins[result.winner];
        overText.textContent = mode === 'ai'
          ? (result.winner === 'X' ? 'You win! 🎉' : 'Computer wins!')
          : `Player ${result.winner} wins!`;
        SGPGame.beep(820, 0.15, 'sine');
      }
      const won = mode === 'ai' ? result.winner === 'X' : result.winner !== 'draw';
      SGPGame.reportResult('tictactoe', { won, coinsDelta: 8, xpDelta: 10 });
      render(result.line, i);
      overlay.style.display = 'flex';
      return;
    }
    turn = turn === 'X' ? 'O' : 'X';
    render(undefined, i);
    if (active && mode === 'ai' && turn === 'O') {
      setTimeout(() => { if (active) commitMove(aiPickMove()); }, 450);
    }
  }

  function nextRound() {
    board = Array(9).fill(null);
    turn = 'X'; active = true;
    overlay.style.display = 'none';
    render();
  }
  document.getElementById('nextBtn').addEventListener('click', nextRound);
  nextRound();
})();
</script>
</body>
</html>
