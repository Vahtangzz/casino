<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Breakout — School Games Portal</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div id="app-header"></div>
<main>
  <div class="container game-shell">
    <div id="gameTopbar"></div>
    <div class="game-stage">
      <div class="game-hud"><span>Score: <b id="hudScore">0</b></span><span>Lives: <b id="hudLives">3</b></span><span>Best: <b id="hudBest">0</b></span></div>
      <div class="stage-wrap">
        <canvas id="cv" width="400" height="380" aria-label="Breakout board"></canvas>
        <div class="overlay-msg" id="overlay">
          <h2>🧱 Breakout</h2>
          <p class="muted">Bounce the ball with your paddle and clear every brick.</p>
          <button class="btn primary" id="startBtn">Start</button>
        </div>
      </div>
      <div class="game-controls-hint">Arrow keys / A-D to move. Drag on mobile.</div>
      <div class="touch-pad" id="dpad" style="grid-template-columns:repeat(2,64px);grid-template-rows:52px"></div>
    </div>
  </div>
</main>
<div id="toast-root"></div>
<script src="../js/storage.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/achievements.js"></script>
<script src="../js/games-data.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/game-api.js"></script>
<script>
SGPUI.renderHeader('');
SGPGame.renderTopbar({ id: 'breakout', title: 'Breakout', icon: '🧱' });

(() => {
  const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  const overlay = document.getElementById('overlay');
  const hudScore = document.getElementById('hudScore'), hudLives = document.getElementById('hudLives'), hudBest = document.getElementById('hudBest');
  const best = () => (SGPGame.activeAccount().highScores && SGPGame.activeAccount().highScores.breakout) || 0;
  hudBest.textContent = best();

  const PADDLE_W = 70, PADDLE_H = 10, BALL_R = 6;
  const ROWS = 5, COLS = 8, BRICK_W = W / COLS, BRICK_H = 18;
  let paddleX, ball, bricks, score, lives, running, raf, moveDir = 0;

  function reset() {
    paddleX = W / 2 - PADDLE_W / 2;
    ball = { x: W / 2, y: H - 40, vx: 2.6, vy: -3.4 };
    bricks = [];
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) bricks.push({ x: c * BRICK_W, y: r * BRICK_H + 30, alive: true, color: `hsl(${200 + r * 30},70%,60%)` });
    score = 0; lives = 3;
    hudScore.textContent = 0; hudLives.textContent = 3;
  }

  function draw() {
    ctx.fillStyle = '#0f1420'; ctx.fillRect(0, 0, W, H);
    bricks.forEach(b => { if (b.alive) { ctx.fillStyle = b.color; ctx.fillRect(b.x + 2, b.y, BRICK_W - 4, BRICK_H - 4); } });
    ctx.fillStyle = '#5b8cff'; ctx.fillRect(paddleX, H - 16, PADDLE_W, PADDLE_H);
    ctx.fillStyle = '#f5b942'; ctx.beginPath(); ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2); ctx.fill();
  }

  function update() {
    paddleX += moveDir * 5.5;
    paddleX = Math.max(0, Math.min(W - PADDLE_W, paddleX));

    ball.x += ball.vx; ball.y += ball.vy;
    if (ball.x < BALL_R || ball.x > W - BALL_R) ball.vx *= -1;
    if (ball.y < BALL_R) ball.vy *= -1;

    if (ball.y + BALL_R >= H - 16 && ball.y + BALL_R <= H && ball.x > paddleX && ball.x < paddleX + PADDLE_W && ball.vy > 0) {
      const hitPos = (ball.x - paddleX) / PADDLE_W - 0.5;
      ball.vx = hitPos * 6;
      ball.vy = -Math.abs(ball.vy);
      SGPGame.beep(500, 0.04, 'square');
    }

    bricks.forEach(b => {
      if (!b.alive) return;
      if (ball.x > b.x && ball.x < b.x + BRICK_W && ball.y - BALL_R < b.y + BRICK_H && ball.y + BALL_R > b.y) {
        b.alive = false; ball.vy *= -1; score += 10; hudScore.textContent = score;
        SGPGame.beep(700, 0.04, 'sine');
      }
    });

    if (ball.y > H) {
      lives--; hudLives.textContent = lives;
      if (lives <= 0) return gameOver(false);
      ball = { x: W / 2, y: H - 40, vx: 2.6, vy: -3.4 };
    }

    if (bricks.every(b => !b.alive)) return gameOver(true);
  }

  function loop() {
    if (!running) return;
    update();
    if (running) { draw(); raf = requestAnimationFrame(loop); }
  }

  function gameOver(won) {
    running = false; cancelAnimationFrame(raf);
    SGPGame.beep(won ? 880 : 120, won ? 0.2 : 0.25, won ? 'sine' : 'sawtooth');
    const coins = score / 2 + (won ? 100 : 0), xp = score / 2 + (won ? 80 : 0);
    SGPGame.reportResult('breakout', { score, won, coinsDelta: coins, xpDelta: xp });
    hudBest.textContent = best();
    overlay.innerHTML = `<h2>${won ? 'Cleared! 🎉' : 'Game Over'}</h2><p class="muted">Score: ${score} &middot; +${Math.round(coins)} coins</p><button class="btn primary" id="startBtn">Play Again</button>`;
    overlay.style.display = 'flex'; wireStart();
  }

  function start() { reset(); draw(); overlay.style.display = 'none'; running = true; raf = requestAnimationFrame(loop); }
  function wireStart() { document.getElementById('startBtn').addEventListener('click', start); }
  wireStart();

  document.addEventListener('keydown', e => {
    if (['arrowleft','a'].includes(e.key.toLowerCase())) moveDir = -1;
    else if (['arrowright','d'].includes(e.key.toLowerCase())) moveDir = 1;
  });
  document.addEventListener('keyup', e => {
    if (['arrowleft','a','arrowright','d'].includes(e.key.toLowerCase())) moveDir = 0;
  });

  cv.addEventListener('pointermove', e => {
    if (!running) return;
    const rect = cv.getBoundingClientRect();
    const scaleX = cv.width / rect.width;
    paddleX = Math.max(0, Math.min(W - PADDLE_W, (e.clientX - rect.left) * scaleX - PADDLE_W / 2));
  });

  const dpad = document.getElementById('dpad');
  dpad.innerHTML = '';
  const leftBtn = document.createElement('button'); leftBtn.textContent = '◀';
  const rightBtn = document.createElement('button'); rightBtn.textContent = '▶';
  [leftBtn, rightBtn].forEach((b, i) => {
    b.addEventListener('pointerdown', () => moveDir = i === 0 ? -1 : 1);
    b.addEventListener('pointerup', () => moveDir = 0);
    b.addEventListener('pointerleave', () => moveDir = 0);
    dpad.appendChild(b);
  });
})();
</script>
</body>
</html>
