<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flap Dash — School Games Portal</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div id="app-header"></div>
<main>
  <div class="container game-shell">
    <div id="gameTopbar"></div>
    <div class="game-stage">
      <div class="game-hud"><span>Score: <b id="hudScore">0</b></span><span>Best: <b id="hudBest">0</b></span></div>
      <div class="stage-wrap">
        <canvas id="cv" width="360" height="480" aria-label="Flap Dash game board"></canvas>
        <div class="overlay-msg" id="overlay">
          <h2>🐤 Flap Dash</h2>
          <p class="muted">Tap, click or press Space to flap through the gaps.</p>
          <button class="btn primary" id="startBtn">Start Game</button>
        </div>
      </div>
      <div class="game-controls-hint">Space / Click / Tap to flap.</div>
    </div>
  </div>
</main>
<div id="toast-root"></div>
<script src="../js/storage.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/achievements.js"></script>
<script src="../js/cosmetics.js"></script>
<script src="../js/games-data.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/game-api.js"></script>
<script>
SGPUI.renderHeader('');
SGPGame.renderTopbar({ id: 'flappy', title: 'Flap Dash', icon: '🐤' });

(() => {
  const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  const overlay = document.getElementById('overlay');
  const hudScore = document.getElementById('hudScore'), hudBest = document.getElementById('hudBest');
  const best = () => (SGPGame.activeAccount().highScores && SGPGame.activeAccount().highScores.flappy) || 0;
  hudBest.textContent = best();

  let bird, pipes, score, running = false, raf, lastT;
  const GRAVITY = 460;       // px/s^2 -- casual, forgiving
  const FLAP_VELOCITY = -245; // px/s
  const PIPE_SPEED = 90;     // px/s
  const BASE_GAP = 215;

  function reset() {
    bird = { x: 70, y: H / 2, vy: 0 };
    pipes = [];
    score = 0;
    hudScore.textContent = 0;
    spawnPipe();
  }

  // The first several pipes get a much wider gap that tapers down to the
  // normal difficulty, so a new player isn't thrown straight into the hard mode.
  function gapForPipeIndex(n) {
    const easyBonus = Math.max(0, 6 - n) * 12;
    return BASE_GAP + easyBonus;
  }

  function spawnPipe() {
    const margin = 45;
    const thisGap = gapForPipeIndex(pipes.length);
    const gapY = margin + Math.random() * (H - margin * 2 - thisGap);
    pipes.push({ x: W + 20, gapY, gapH: thisGap, passed: false });
  }

  function flap() {
    if (!running) return;
    bird.vy = FLAP_VELOCITY;
    SGPGame.beep(500, 0.05, 'square');
  }

  function update(dt) {
    bird.vy += GRAVITY * dt;
    bird.y += bird.vy * dt;
    pipes.forEach(p => p.x -= PIPE_SPEED * dt);
    if (pipes.length && pipes[pipes.length - 1].x < W - 220) spawnPipe();
    if (pipes.length && pipes[0].x < -60) pipes.shift();

    pipes.forEach(p => {
      if (!p.passed && p.x + 30 < bird.x) { p.passed = true; score++; hudScore.textContent = score; SGPGame.beep(760, 0.05, 'sine'); }
    });

    const hitR = 7; // noticeably smaller than the drawn radius -- a forgiving hitbox
    const hitFloor = bird.y > H - 14 || bird.y < 0;
    const hitPipe = pipes.some(p => {
      const withinX = bird.x + hitR > p.x && bird.x - hitR < p.x + 34;
      const withinGap = bird.y - hitR > p.gapY && bird.y + hitR < p.gapY + p.gapH;
      return withinX && !withinGap;
    });
    if (hitFloor || hitPipe) return gameOver();
  }

  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#182140'); sky.addColorStop(1, '#0c1120');

  function drawPipe(x, top, bottom) {
    const grad = ctx.createLinearGradient(x, 0, x + 34, 0);
    grad.addColorStop(0, '#26335c'); grad.addColorStop(0.5, '#39508f'); grad.addColorStop(1, '#26335c');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.roundRect(x, 0, 34, top, [0, 0, 6, 6]); ctx.fill();
    ctx.beginPath(); ctx.roundRect(x, H - bottom, 34, bottom, [6, 6, 0, 0]); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.08)';
    ctx.fillRect(x + 4, 0, 4, top);
    ctx.fillRect(x + 4, H - bottom, 4, bottom);
  }

  function draw() {
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
    pipes.forEach(p => drawPipe(p.x, p.gapY, H - (p.gapY + p.gapH)));

    ctx.save();
    ctx.translate(bird.x, bird.y);
    ctx.rotate(Math.max(-0.5, Math.min(0.9, bird.vy / 500)));
    const bodyGrad = ctx.createRadialGradient(-4, -4, 2, 0, 0, 13);
    bodyGrad.addColorStop(0, '#8fb0ff'); bodyGrad.addColorStop(1, '#4270e6');
    ctx.fillStyle = bodyGrad;
    ctx.beginPath(); ctx.ellipse(0, 0, 13, 11, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#f5b942';
    ctx.beginPath(); ctx.moveTo(11, -2); ctx.lineTo(20, 1); ctx.lineTo(11, 4); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#0f1420';
    ctx.beginPath(); ctx.arc(4, -4, 2.3, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function loop(t) {
    if (!running) return;
    const dt = lastT ? Math.min(0.05, (t - lastT) / 1000) : 1 / 60;
    lastT = t;
    update(dt);
    if (running) { draw(); raf = requestAnimationFrame(loop); }
  }

  function gameOver() {
    running = false;
    cancelAnimationFrame(raf);
    SGPGame.beep(120, 0.25, 'sawtooth');
    const coins = score * 4, xp = score * 6;
    SGPGame.reportResult('flappy', { score, coinsDelta: coins, xpDelta: xp });
    hudBest.textContent = best();
    overlay.innerHTML = `<h2>Game Over</h2><p class="muted">Score: ${score} &middot; +${coins} coins</p><button class="btn primary" id="startBtn">Play Again</button>`;
    overlay.style.display = 'flex';
    wireStart();
  }

  function start() {
    reset(); draw();
    overlay.style.display = 'none';
    running = true; lastT = null;
    raf = requestAnimationFrame(loop);
  }

  function wireStart() { document.getElementById('startBtn').addEventListener('click', start); }
  wireStart();

  document.addEventListener('keydown', e => { if (e.key === ' ') { e.preventDefault(); flap(); } });
  cv.addEventListener('pointerdown', flap);
})();
</script>
</body>
</html>
