<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Snake — School Games Portal</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div id="app-header"></div>
<main>
  <div class="container game-shell">
    <div id="gameTopbar"></div>
    <div class="game-stage">
      <div class="game-hud"><span>Score: <b id="hudScore">0</b></span><span>Best: <b id="hudBest">0</b></span></div>
      <div class="stage-wrap">
        <canvas id="cv" width="400" height="400" aria-label="Snake game board"></canvas>
        <div class="overlay-msg" id="overlay">
          <h2>🐍 Snake</h2>
          <p class="muted">Eat the food, grow longer, don't hit yourself or the wall.</p>
          <button class="btn primary" id="startBtn">Start Game</button>
        </div>
      </div>
      <div class="game-controls-hint">Arrow keys / WASD to steer. Space to pause.</div>
      <div class="touch-pad" id="dpad"></div>
    </div>
  </div>
</main>
<div id="toast-root"></div>
<script src="../js/storage.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/achievements.js"></script>
<script src="../js/games-data.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/game-api.js"></script>
<script>
SGPUI.renderHeader('');
SGPGame.renderTopbar({ id: 'snake', title: 'Snake', icon: '🐍' });

(() => {
  const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  const GRID = 20, CELL = cv.width / GRID;
  const overlay = document.getElementById('overlay');
  const hudScore = document.getElementById('hudScore'), hudBest = document.getElementById('hudBest');
  let snake, dir, nextDir, food, score, speed, timer, running = false, paused = false;

  const best = () => (SGPGame.activeAccount().highScores && SGPGame.activeAccount().highScores.snake) || 0;
  hudBest.textContent = best();

  function reset() {
    snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    dir = { x: 1, y: 0 }; nextDir = dir;
    score = 0; speed = 130;
    placeFood();
    hudScore.textContent = score;
  }

  function placeFood() {
    do { food = { x: Math.floor(Math.random() * GRID), y: Math.floor(Math.random() * GRID) }; }
    while (snake.some(s => s.x === food.x && s.y === food.y));
  }

  let pulseT = 0;
  function draw() {
    ctx.fillStyle = '#0f1420';
    ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.strokeStyle = 'rgba(255,255,255,.03)';
    for (let i = 1; i < GRID; i++) {
      ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, cv.height); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(cv.width, i * CELL); ctx.stroke();
    }

    pulseT += 0.12;
    const pulse = 1 + Math.sin(pulseT) * 0.08;
    const fx = food.x * CELL + CELL / 2, fy = food.y * CELL + CELL / 2;
    const foodGrad = ctx.createRadialGradient(fx, fy, 1, fx, fy, (CELL / 2) * pulse);
    foodGrad.addColorStop(0, '#ffe28a'); foodGrad.addColorStop(1, '#f5b942');
    ctx.fillStyle = foodGrad;
    ctx.beginPath(); ctx.arc(fx, fy, (CELL / 2 - 2) * pulse, 0, Math.PI * 2); ctx.fill();

    snake.forEach((s, i) => {
      const isHead = i === 0;
      const grad = ctx.createLinearGradient(s.x * CELL, s.y * CELL, s.x * CELL + CELL, s.y * CELL + CELL);
      if (isHead) { grad.addColorStop(0, '#8fb0ff'); grad.addColorStop(1, '#4270e6'); }
      else { grad.addColorStop(0, '#5be0cc'); grad.addColorStop(1, '#26a892'); }
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.roundRect(s.x * CELL + 1, s.y * CELL + 1, CELL - 2, CELL - 2, isHead ? 7 : 5);
      ctx.fill();
    });

    if (snake.length) {
      const h = snake[0];
      const cx = h.x * CELL + CELL / 2, cy = h.y * CELL + CELL / 2;
      const ex = dir.x * 4, ey = dir.y * 4;
      const perpX = -dir.y * 3, perpY = dir.x * 3;
      ctx.fillStyle = '#0f1420';
      ctx.beginPath(); ctx.arc(cx + ex + perpX, cy + ey + perpY, 1.6, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx + ex - perpX, cy + ey - perpY, 1.6, 0, Math.PI * 2); ctx.fill();
    }
  }

  function tick() {
    if (paused) return;
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    if (head.x < 0 || head.y < 0 || head.x >= GRID || head.y >= GRID || snake.some(s => s.x === head.x && s.y === head.y)) {
      return gameOver();
    }
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score++;
      hudScore.textContent = score;
      SGPGame.beep(660, 0.06, 'square');
      placeFood();
      if (speed > 60 && score % 4 === 0) { speed -= 6; restartTimer(); }
    } else {
      snake.pop();
    }
    draw();
  }

  function restartTimer() {
    clearInterval(timer);
    timer = setInterval(tick, speed);
  }

  function gameOver() {
    running = false;
    clearInterval(timer);
    SGPGame.beep(120, 0.25, 'sawtooth');
    const coins = score * 3, xp = score * 5;
    SGPGame.reportResult('snake', { score, coinsDelta: coins, xpDelta: xp });
    hudBest.textContent = best();
    overlay.innerHTML = `<h2>Game Over</h2><p class="muted">Score: ${score} &middot; +${coins} coins</p><button class="btn primary" id="startBtn">Play Again</button>`;
    overlay.style.display = 'flex';
    wireStart();
  }

  function start() {
    reset();
    draw();
    overlay.style.display = 'none';
    running = true; paused = false;
    restartTimer();
  }

  function wireStart() { document.getElementById('startBtn').addEventListener('click', start); }
  wireStart();

  function setDir(x, y) {
    if (dir.x === -x && dir.y === -y) return; // no reversing
    nextDir = { x, y };
  }

  document.addEventListener('keydown', e => {
    if (!running) return;
    const k = e.key.toLowerCase();
    if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
    if (k === 'arrowup' || k === 'w') setDir(0, -1);
    else if (k === 'arrowdown' || k === 's') setDir(0, 1);
    else if (k === 'arrowleft' || k === 'a') setDir(-1, 0);
    else if (k === 'arrowright' || k === 'd') setDir(1, 0);
    else if (k === ' ') paused = !paused;
  });

  SGPGame.mountDirPad(document.getElementById('dpad'), {
    onUp: () => setDir(0, -1), onDown: () => setDir(0, 1),
    onLeft: () => setDir(-1, 0), onRight: () => setDir(1, 0)
  });
})();
</script>
</body>
</html>
